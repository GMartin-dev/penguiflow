name: Publish Release

# Final (non-prerelease) version tags create a GitHub Release whose notes are
# extracted from CHANGELOG.md. PyPI publishing for finals is handled by the
# `publish` job in ci.yml on push to main; this workflow only manages the
# GitHub Releases page so the changelog is mirrored automatically on release.

on:
  push:
    tags:
      # GitHub Actions tag filters are glob patterns, not regex, so we do NOT
      # try to express "final semver only" here. This coarse glob nets every
      # version-like tag (finals AND prereleases such as v3.11.0a8 / v3.11.0rc1);
      # the `gate` step below is the precise, reliable filter that skips
      # prereleases and validates the tag against pyproject's version.
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate — final release tag matching package version
        id: gate
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          out = os.environ["GITHUB_OUTPUT"]

          def emit(key: str, value: str) -> None:
              with open(out, "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          # Prereleases (v3.11.0a8, v3.11.0rc1, ...) are handled by
          # publish-prerelease.yml. Skip cleanly (green no-op) rather than fail.
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              print(f"Tag {tag!r} is not a final release tag; skipping.")
              emit("final", "false")
              raise SystemExit(0)

          # A final tag that disagrees with the packaged version is a real
          # release mistake — fail loudly.
          expected = tag.removeprefix("v")
          with open("pyproject.toml", "rb") as handle:
              actual = tomllib.load(handle)["project"]["version"]
          if actual != expected:
              raise SystemExit(
                  f"pyproject version {actual!r} does not match tag {tag!r}"
              )

          emit("final", "true")
          PY

      - name: Extract changelog section for this version
        if: steps.gate.outputs.final == 'true'
        id: notes
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          with open("CHANGELOG.md", encoding="utf-8") as handle:
              lines = handle.read().splitlines()

          # Find the "## <version> — <date>" heading, then capture until the
          # next top-level "## " heading.
          start = None
          heading = re.compile(rf"^##\s+{re.escape(version)}(\s|$)")
          for i, line in enumerate(lines):
              if heading.match(line):
                  start = i
                  break
          if start is None:
              raise SystemExit(
                  f"No changelog section found for version {version!r}"
              )

          body = []
          for line in lines[start + 1 :]:
              if line.startswith("## "):
                  break
              body.append(line)

          notes = "\n".join(body).strip() or f"Release {version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("body<<EOF\n")
              out.write(notes + "\n")
              out.write("EOF\n")
          PY

      - name: Create or update GitHub Release
        if: steps.gate.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi

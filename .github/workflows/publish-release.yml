name: Publish Release

# Final (non-prerelease) version tags create a GitHub Release whose notes are
# extracted from CHANGELOG.md. PyPI publishing for finals is handled by the
# `publish` job in ci.yml on push to main; this workflow only manages the
# GitHub Releases page so the changelog is mirrored automatically on release.

on:
  push:
    tags:
      # Final semver tags only (e.g. v3.11.0). Prerelease tags such as
      # v3.11.0a8 / v3.11.0rc1 do not match this pattern and are handled by
      # publish-prerelease.yml.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify final release tag matches package version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(
                  f"Tag {tag!r} is not a final release tag (expected vX.Y.Z)"
              )

          expected = tag.removeprefix("v")
          with open("pyproject.toml", "rb") as handle:
              actual = tomllib.load(handle)["project"]["version"]
          if actual != expected:
              raise SystemExit(
                  f"pyproject version {actual!r} does not match tag {tag!r}"
              )
          PY

      - name: Extract changelog section for this version
        id: notes
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          with open("CHANGELOG.md", encoding="utf-8") as handle:
              lines = handle.read().splitlines()

          # Find the "## <version> — <date>" heading, then capture until the
          # next top-level "## " heading.
          start = None
          heading = re.compile(rf"^##\s+{re.escape(version)}(\s|$)")
          for i, line in enumerate(lines):
              if heading.match(line):
                  start = i
                  break
          if start is None:
              raise SystemExit(
                  f"No changelog section found for version {version!r}"
              )

          body = []
          for line in lines[start + 1 :]:
              if line.startswith("## "):
                  break
              body.append(line)

          notes = "\n".join(body).strip() or f"Release {version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("body<<EOF\n")
              out.write(notes + "\n")
              out.write("EOF\n")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
